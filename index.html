<style>

  *{box-sizing:border-box; margin:0}
  body{

  h1 .num{font-family:"IBM Plex Mono",monospace; color:var(--up)}
  p{color:var(--ink2); margin-top:10px}
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:28px 32px; margin-top:28px;
  }
  a{color:var(--ink); font-weight:600}
  .foot{margin-top:28px; font-size:13px; color:var(--ink3)}
